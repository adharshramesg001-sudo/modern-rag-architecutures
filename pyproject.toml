[project]
name = "rag-compare"
version = "0.1.0"
description = "Six working RAG architecture apps sharing one real retrieval stack"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_compare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
